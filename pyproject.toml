[project]
name = "shoremonitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Derrick Gatonye", email = "derekgk0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "folium>=1.0.0",
    "geopandas>=1.2.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "planetary-computer>=1.0.0",
    "plotly>=7.1.0",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.1",
    "rasterio>=1.5.2",
    "rioxarray>=0.24.0",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "streamlit>=1.67.0",
    "xarray>=2026.9.0",
]

[project.scripts]
shoremonitor = "shoremonitor:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
